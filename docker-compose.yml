
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathverse-app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mathverse-network

  nginx:
    image: nginx:alpine
    container_name: mathverse-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mathverse-network

  db:
    image: mariadb:11.4
    container_name: mathverse-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mathverse
      MARIADB_USER: mathverse
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mathverse-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mathverse-network

networks:
  mathverse-network:
    driver: bridge

volumes:
  mathverse-db-data:

